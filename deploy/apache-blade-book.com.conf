# blade-book.com — its own vhost. Enabled by scripts/enable_domain.sh once DNS
# points here; certbot adds the :443 twin. Same backend as the /blade-book/
# alias on billboard.instockornot.club, served at the root of this host.
<VirtualHost *:80>
    ServerName blade-book.com
    ServerAlias www.blade-book.com
    ServerAdmin webmaster@localhost

    # root of this host == the /blade-book/ bundle
    DocumentRoot /var/www/html/blade-book
    <Directory /var/www/html/blade-book>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # the app is written against the /blade-book prefix; keep both spellings
    # working so links copied from the alias era never break
    ProxyPreserveHost On
    ProxyPass        /blade-book/api/  http://127.0.0.1:5004/blade-book/api/
    ProxyPassReverse /blade-book/api/  http://127.0.0.1:5004/blade-book/api/
    ProxyPass        /api/             http://127.0.0.1:5004/blade-book/api/
    ProxyPassReverse /api/             http://127.0.0.1:5004/blade-book/api/
    RedirectMatch 301 ^/blade-book/?$ /
    Alias /blade-book /var/www/html/blade-book

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # fonts: Bebas Neue + DM Sans from Google Fonts (spec §2 decision 12)
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'"

    ErrorLog ${APACHE_LOG_DIR}/blade-book_error.log
    CustomLog ${APACHE_LOG_DIR}/blade-book_access.log combined
</VirtualHost>
