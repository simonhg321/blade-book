# blade-book.com — its own vhost. Enabled by scripts/enable_domain.sh once DNS
# points here; certbot adds the :443 twin. Same backend as the /blade-book/
# alias on billboard.instockornot.club, served at the root of this host.
<VirtualHost *:80>
    ServerName blade-book.com
    ServerAlias www.blade-book.com
    ServerAdmin webmaster@localhost

    # root of this host == the /blade-book/ bundle
    DocumentRoot /var/www/html/blade-book
    # styled not-found page (static files only; proxied /api/ 404s keep their JSON bodies)
    ErrorDocument 404 /404.html
    <Directory /var/www/html/blade-book>
        Options -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "\.(html|json)$">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Pragma "no-cache"
            Header set Expires "0"
        </FilesMatch>
        <FilesMatch "\.(jpg|jpeg|png|svg|woff2)$">
            Header set Cache-Control "public, max-age=300"
        </FilesMatch>
    </Directory>
    # publish.build_user builds into a *.tmp sibling of each @handle bundle dir
    # and renames it into place; belt-and-braces in case a stranded .tmp ever
    # survives a crashed build (see bb/publish.py build_user), never serve it.
    <DirectoryMatch "\.tmp(/|$)">
        Require all denied
    </DirectoryMatch>

    # the app is written against the /blade-book prefix; keep both spellings
    # working so links copied from the alias era never break
    ProxyPreserveHost On
    ProxyPass        /blade-book/api/  http://127.0.0.1:5004/blade-book/api/
    ProxyPassReverse /blade-book/api/  http://127.0.0.1:5004/blade-book/api/
    ProxyPass        /api/             http://127.0.0.1:5004/blade-book/api/
    ProxyPassReverse /api/             http://127.0.0.1:5004/blade-book/api/
    RedirectMatch 301 ^/blade-book/?$ /
    Alias /blade-book /var/www/html/blade-book

    # one canonical host: www → apex (sessions are host-bound; two hosts = two sign-ins)
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://blade-book.com%{REQUEST_URI} [R=301,L]

    # SECURITY HEADERS — parity with the billboard alias vhost (security review
    # 2026-09-04 M4). certbot clones this block into the :443 twin; HSTS is
    # ignored by browsers over plain http, so it is harmless here and right there.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set X-XSS-Protection "0"
    # fonts are self-hosted (plan 05) — no Google Fonts hosts
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'"

    ErrorLog ${APACHE_LOG_DIR}/blade-book_error.log
    CustomLog ${APACHE_LOG_DIR}/blade-book_access.log combined
</VirtualHost>
