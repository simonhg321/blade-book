# blade-book — included by the billboard.instockornot.club vhosts until
# blade-book.com has its own. Static from WWW_DIR, API proxied to gunicorn.
Alias /blade-book /var/www/html/blade-book
<Directory /var/www/html/blade-book>
    Options -Indexes
    AllowOverride None
    Require all granted
    # Bundles regenerate ~30 s after a save; without this, browsers heuristically
    # cache the old page and a collector's fresh knife "doesn't show up".
    <FilesMatch "\.(html|json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(jpg|jpeg|png|svg|woff2)$">
        Header set Cache-Control "public, max-age=300"
    </FilesMatch>
</Directory>
# publish.build_user builds into a *.tmp sibling of each @handle bundle dir and
# renames it into place; belt-and-braces in case a stranded .tmp ever survives
# a crashed build (see bb/publish.py build_user), never serve it.
<DirectoryMatch "\.tmp(/|$)">
    Require all denied
</DirectoryMatch>
ProxyPass        /blade-book/api/  http://127.0.0.1:5004/blade-book/api/
ProxyPassReverse /blade-book/api/  http://127.0.0.1:5004/blade-book/api/
