<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>blade-book — admin</title>
<link rel="icon" type="image/svg+xml" href="/blade-book/mark.svg">
<link rel="stylesheet" href="/blade-book/vibe.css?v=20260904">
<style>
  body{max-width:640px;margin:0 auto;padding:14px 14px 60px}
  #status{text-align:center;color:var(--muted);min-height:1.3em;margin:6px 0;font-size:.9rem}
  #status.err{color:var(--accent);font-weight:700}
  .item{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .item .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .item .top a{color:var(--ink);font-weight:700;text-decoration:none}
  .item ul{margin:6px 0 8px;padding-left:18px;font-size:.9rem}
  .item li span{color:var(--muted);font-size:.8rem}
  .item .acts{display:flex;gap:8px}
  .item .acts .btn{padding:.45rem .7rem;font-size:.82rem}
  .empty{text-align:center;color:var(--muted);padding:24px 0}
  .urow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:.9rem}
  .urow .meta{color:var(--muted);font-size:.8rem}
  .urow .acts{display:flex;gap:6px}
  .urow .acts .btn{padding:.35rem .6rem;font-size:.78rem}
  .urow .acts .btn[disabled]{opacity:.4}
</style>

<header class="bb-head">
  <h1 class="bb-display"><img class="bbmark" src="/blade-book/mark.svg" alt="" width="30">ADMIN</h1>
  <nav class="bb-nav"><a class="add" href="/blade-book/me/add/">+ add</a><a href="/blade-book/me/">register</a><a href="/blade-book/me/wants/">wants</a><a href="/blade-book/me/settings/">settings</a><a href="/blade-book/board/">board</a><a href="/blade-book/">home</a><a id="adminlink" href="/blade-book/admin/" hidden>admin</a><button id="signout" class="btn link" type="button">sign out</button></nav>
</header>
<div id="status" aria-live="polite"></div>
<h2 class="bb-display" style="margin:18px 0 6px">USERS</h2>
<div id="users"></div>
<h2 class="bb-display" style="margin:18px 0 6px">REPORTS</h2>
<div id="queue"></div>

<script>
(function () {
  var API = '/blade-book/api';
  var ADMIN = '/blade-book/api/admin';
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function say(t, err) { var s = $('status'); s.textContent = t || ''; s.className = err ? 'err' : ''; }
  function req(url, opts) {
    opts = opts || {}; opts.credentials = 'same-origin';
    return fetch(url, opts).then(function (r) {
      if (r.status === 401 || r.status === 403) { location.href = '/blade-book/'; throw new Error('sign in'); }
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
    });
  }
  function post(url, body) {
    return req(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  }

  function act(knifeId, action, tag) {
    var note = prompt(action + ' ' + tag + ' — note (required, goes on the resolved reports):');
    if (!note || !note.trim()) return;
    if (action === 'delete' && !confirm('DELETE ' + tag + ' and its photos for good?')) return;
    post(ADMIN + '/knives/' + knifeId + '/' + action, { note: note.trim() }).then(function (res) {
      if (!res.ok) { say('✗ ' + (res.j.error || 'failed'), true); return; }
      load('✓ ' + action + ' ' + tag);
    }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); });
  }

  function render(reports) {
    var box = $('queue'); clear(box);
    if (!reports.length) { box.appendChild(el('div', 'empty', 'no open reports')); return; }
    var byKnife = {};
    reports.forEach(function (r) { (byKnife[r.knife_id] = byKnife[r.knife_id] || []).push(r); });
    Object.keys(byKnife).forEach(function (kid) {
      var rs = byKnife[kid], first = rs[0];
      var item = el('div', 'item');
      var top = el('div', 'top');
      var a = el('a', null, '@' + first.owner_handle + ' / ' + first.tag);
      a.href = '/blade-book/@' + first.owner_handle + '/' + first.tag + '/'; a.target = '_blank'; a.rel = 'noopener';
      top.appendChild(a);
      top.appendChild(el('span', 'badge ' + (first.hidden_at ? 'warn' : ''), first.hidden_at ? 'hidden · ' + first.hidden_by : 'visible'));
      top.appendChild(el('span', 'badge', rs.length + ' open'));
      item.appendChild(top);
      var ul = el('ul');
      rs.forEach(function (r) {
        var li = el('li', null, r.reason + ' ');
        li.appendChild(el('span', null, '— @' + r.reporter_handle + ' · ' + String(r.created).slice(0, 16).replace('T', ' ')));
        ul.appendChild(li);
      });
      item.appendChild(ul);
      var acts = el('div', 'acts');
      var hide = el('button', 'btn alt', 'hide'); hide.type = 'button'; hide.disabled = !!first.hidden_at;
      var restore = el('button', 'btn alt', 'restore'); restore.type = 'button'; restore.disabled = !first.hidden_at;
      var del = el('button', 'btn accent', 'delete'); del.type = 'button';
      hide.addEventListener('click', function () { act(kid, 'hide', first.tag); });
      restore.addEventListener('click', function () { act(kid, 'restore', first.tag); });
      del.addEventListener('click', function () { act(kid, 'delete', first.tag); });
      acts.appendChild(hide); acts.appendChild(restore); acts.appendChild(del);
      item.appendChild(acts);
      box.appendChild(item);
    });
  }

  function load(keep) {
    say('loading…');
    req(ADMIN + '/reports').then(function (res) {
      if (!res.ok) { say(res.j.error || 'failed', true); return; }
      say(keep || '');
      render(res.j.reports || []);
    }).catch(function (e) { if (e.message !== 'sign in') say('could not reach the server', true); });
  }

  function flip(userId, status, handle) {
    if (!confirm('set @' + handle + ' → ' + status + '?')) return;
    post(ADMIN + '/users/' + userId + '/sub', { status: status }).then(function (res) {
      if (!res.ok) { say('✗ ' + (res.j.error || 'failed'), true); return; }
      loadUsers('✓ @' + handle + ' → ' + status);
    }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); });
  }

  function renderUsers(users) {
    var box = $('users'); clear(box);
    if (!users.length) { box.appendChild(el('div', 'empty', 'no users')); return; }
    users.forEach(function (u) {
      var row = el('div', 'urow');
      var left = el('div');
      var a = el('a', null, '@' + u.handle); a.href = '/blade-book/@' + u.handle + '/'; a.target = '_blank'; a.rel = 'noopener';
      a.style.color = 'var(--ink)'; a.style.fontWeight = '700'; a.style.textDecoration = 'none';
      left.appendChild(a);
      left.appendChild(el('span', 'badge ' + (u.sub_status === 'active' ? 'ok' : ''), u.sub_status));
      if (u.is_admin) left.appendChild(el('span', 'badge', 'admin'));
      left.appendChild(el('div', 'meta', u.email + ' · ' + u.knives + ' knives · free_old_used ' + u.free_old_used +
        ' · joined ' + String(u.created).slice(0, 10) + (u.verified_at ? '' : ' · UNVERIFIED')));
      row.appendChild(left);
      var acts = el('div', 'acts');
      ['active', 'free', 'lapsed'].forEach(function (s) {
        var b = el('button', 'btn ' + (s === 'active' ? '' : 'alt'), s); b.type = 'button';
        b.disabled = u.sub_status === s;
        b.addEventListener('click', function () { flip(u.id, s, u.handle); });
        acts.appendChild(b);
      });
      row.appendChild(acts);
      box.appendChild(row);
    });
  }

  function loadUsers(keep) {
    req(ADMIN + '/users').then(function (res) {
      if (!res.ok) { clear($('users')); $('users').appendChild(el('div', 'empty', res.j.error || 'could not load users')); return; }
      if (keep) say(keep);
      renderUsers(res.j.users || []);
    }).catch(function (e) {
      if (e.message !== 'sign in') { clear($('users')); $('users').appendChild(el('div', 'empty', 'could not load users')); }
    });
  }

  req(API + '/auth/me').then(function (res) {
    if (!res.ok || !res.j.is_admin) { location.href = '/blade-book/'; return; }
    loadUsers();
    load();
  }).catch(function () { say('could not reach the server', true); });
})();
</script>
<script src="/blade-book/nav.js?v=20260904" defer></script>
