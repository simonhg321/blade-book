<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>blade-book — my register</title>
<link rel="icon" type="image/svg+xml" href="/blade-book/mark.svg">
<link rel="apple-touch-icon" href="/blade-book/apple-touch-icon.png">
<link rel="stylesheet" href="/blade-book/vibe.css">
<style>
  body{max-width:560px;margin:0 auto;padding:14px 14px 60px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
  header h1{font-size:2.2rem;margin:0}
  header h1 span{color:var(--accent)}
  nav{display:flex;gap:12px;align-items:center;font-size:.9rem}
  nav a{color:var(--muted);text-decoration:none}
  nav a.add{color:var(--accent);font-weight:700}
  .who{color:var(--muted);font-size:.9rem;margin-bottom:10px}
  #q{width:100%;font:inherit;padding:.7rem .9rem;border:2px solid var(--ink);border-radius:10px;background:#fff;margin-bottom:10px}
  #bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:.9rem}
  #status{text-align:center;color:var(--muted);min-height:1.3em;margin:6px 0;font-size:.9rem}
  #status.err{color:var(--accent);font-weight:700}
  #drafts a{display:block;background:#fff;border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;text-decoration:none;color:var(--muted)}
  #drafts a b{color:var(--ink)}
  .knife{margin-bottom:18px}
  .knife .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .knife .tag{font-size:2rem;line-height:1}
  .knife .title{font-weight:700;font-size:1.05rem;flex:1}
  .knife .top input[type=checkbox]{width:20px;height:20px}
  details.more{margin-top:6px}
  details.more>summary{cursor:pointer;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 0;user-select:none;-webkit-user-select:none}
  details.more[open]>summary{color:var(--ink)}
  .photos{display:grid;grid-template-columns:2fr 1fr;grid-auto-rows:1fr;gap:6px;margin-bottom:10px}
  .photos img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:var(--soft);cursor:pointer;aspect-ratio:1}
  .photos img.hero{grid-row:span 2}
  .private{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:.9rem}
  .private h3,.sale h3{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .private dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
  .private dt{color:var(--muted)} .private dd{margin:0;font-weight:600;white-space:pre-wrap}
  .events{list-style:none;padding:0;margin:8px 0 0;font-size:.85rem;color:var(--muted)}
  .events li b{color:var(--ink)}
  .sale{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px;font-size:.9rem}
  .sale select,.sale input,.form input,.form select,.form textarea{font:inherit;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
  .sale .row{display:flex;gap:6px}
  .toggles{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:.9rem;flex-wrap:wrap}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .form{display:grid;gap:8px;margin-top:10px;border-top:2px solid var(--ink);padding-top:10px}
  .form label{display:grid;gap:3px;font-size:.8rem;color:var(--muted)}
  .form label.sec{font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-top:6px}
  .form textarea{min-height:64px;resize:vertical}
  .form .chk{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink)}
  .danger{margin-top:12px;text-align:center}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .empty a{display:inline-block;margin-top:12px}
  #pubsec{margin-bottom:10px}
  #pubsec summary{cursor:pointer;font-weight:700;padding:6px 0}
  #pubsec p{margin:8px 0}
  #pubsec label{display:block;margin:8px 0;font-size:.95rem;color:var(--ink)}
  #pubsec input{margin-right:6px}
  #pubsec button{margin-top:6px;margin-right:6px}
  #pubsec .muted{margin-top:10px}
</style>

<header>
  <h1 class="bb-display"><img class="bbmark" src="/blade-book/mark.svg" alt="" width="30" style="vertical-align:-4px;margin-right:6px">BLADE-<span>BOOK</span></h1>
  <nav><a class="add" href="/blade-book/me/add/">+ add</a><a href="/blade-book/me/wants/">wants</a><a href="/blade-book/how/">how</a><a href="/blade-book/">home</a><button id="signout" class="btn link" type="button">sign out</button></nav>
</header>
<div class="who"><span id="handle"></span> · <span id="count"></span></div>
<input id="q" type="search" placeholder="search your register — everything, private notes too" autocomplete="off">
<div id="bulkbar" class="hidden"><span id="bulkn"></span>
  <button id="bulkpub" class="btn alt" type="button">make public</button>
  <button id="bulkpriv" class="btn alt" type="button">make private</button>
  <button id="bulkclear" class="btn link" type="button">clear</button></div>
<div id="status" aria-live="polite"></div>
<details id="pubsec" class="card">
  <summary>YOUR PUBLIC PAGE</summary>
  <p><a id="publink" target="_blank" rel="noopener"></a></p>
  <label><input type="checkbox" id="hideday"> hide birth <em>day</em> (show month + year only)</label>
  <label><input type="checkbox" id="privprof"> hide the whole page</label>
  <label>page key (optional — visitors need it once):
    <input id="pagekey" placeholder="no key — page is open" autocomplete="off"></label>
  <button id="savekey" class="btn" type="button">set key</button>
  <button id="clearkey" class="btn" type="button" hidden>remove key</button>
  <p class="muted">Changes appear on your public page about 30 seconds after your last save.</p>
</details>
<div id="drafts"></div>
<div id="cards"></div>

<template id="tpl">
  <article class="knife card">
    <div class="top"><input type="checkbox" class="sel" title="select"><span class="tag bb-display"></span><span class="title"></span><span class="badges"></span></div>
    <div class="photos"></div>
    <div class="toggles"><label><input type="checkbox" class="pub"> public on my page</label>
      <button class="btn alt hero" type="button" hidden>★ register hero</button></div>
    <details class="more"><summary>details · sale · edit</summary>
      <table><tbody class="rows"></tbody></table>
      <div class="flags"></div>
      <div class="private"><h3>private</h3><dl class="priv"></dl><ul class="events"></ul></div>
      <div class="sale"><h3>sale</h3>
        <select class="sstatus"><option value="keeping">keeping</option><option value="for_trade">for trade</option><option value="for_sale">for sale</option><option value="consigned">consigned</option><option value="sold">sold</option></select>
        <div class="row"><input class="asking" type="number" min="0" step="1" placeholder="asking $"><input class="amount hidden" type="number" min="0" step="1" placeholder="sold for $"></div>
        <input class="snote" maxlength="500" placeholder="seller note (public on the board)">
        <input class="counterparty hidden" maxlength="200" placeholder="sold / traded to (private)">
        <button class="btn alt apply" type="button">apply</button></div>
      <div class="actions"><button class="btn alt edit" type="button">✎ edit</button><button class="btn alt redecode" type="button">⚡ re-read the card</button></div>
      <form class="form hidden"></form>
    </details>
  </article>
</template>

<script>
(function () {
  var API = '/blade-book/api';
  var $ = function (id) { return document.getElementById(id); };
  var knives = [], selected = {}, didScroll = false;
  var openMap = {};   // per-knife details expander state — survives re-renders
  var featuredId = null;   // settings.featured_knife_id — the pinned register hero

  function say(t, err) { var s = $('status'); s.textContent = t || ''; s.className = err ? 'err' : ''; }
  function api(path, opts) {
    opts = opts || {}; opts.credentials = 'same-origin';
    return fetch(API + path, opts).then(function (r) {
      if (r.status === 401) { location.href = '/blade-book/'; throw new Error('sign in'); }
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
    });
  }
  function json(method, path, body) {
    return api(path, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  // --- field definitions: the edit form and the card rows come from ONE list ---
  // [key, label, kind, options?]  key 'ext.x' lives in ext; kind: text|num|date|born|select|bool|long|sec
  var GEN = ['', 'Classic', '21', '25', '31'], HAND = ['', 'right', 'left'];
  var FIELDS = [
    ['sec', 'knife'],
    ['model', 'model', 'text'], ['variant', 'variant', 'text'], ['ext.size', 'size', 'select', ['', 'Small', 'Large']],
    ['ext.generation', 'generation', 'select', GEN], ['ext.crk_sku', 'SKU', 'text'], ['ext.special_edition', 'edition', 'text'],
    ['sec', 'blade'],
    ['blade_steel', 'steel', 'text'], ['ext.hardness_note', 'hardness', 'text'], ['blade_shape', 'shape', 'text'],
    ['blade_length_in', 'length (in)', 'num'], ['ext.damascus_smith', 'damascus smith', 'text'], ['ext.damascus_pattern', 'pattern', 'text'],
    ['sec', 'handle'],
    ['handle_material', 'material', 'text'], ['lock_type', 'lock', 'text'],
    ['ext.handle_treatment', 'treatment', 'select', ['', 'plain-ti', 'inlay', 'unique graphic', 'CGG', 'front face', 'CAD Custom', 'other']],
    ['ext.inlay_material', 'inlay', 'text'], ['ext.graphic_name', 'graphic', 'text'], ['ext.surface_finish', 'finish', 'text'],
    ['ext.hardware_note', 'hardware', 'text'], ['ext.hand', 'hand', 'select', HAND], ['ext.hand_on_box', 'hand on box', 'select', HAND],
    ['sec', 'date'],
    ['born_on', 'born on', 'born'], ['born_on_precision', 'precision', 'select', ['', 'day', 'month', 'year']],
    ['born_on_source', 'source', 'select', ['', 'card', 'box', 'owner', 'inferred']],
    ['sec', 'kit'],
    ['condition', 'condition (1 new … 4 used)', 'select', ['', '1', '2', '3', '4']], ['ext.box_type', 'box type', 'text'],
    ['has_box', 'box', 'bool'], ['has_card', 'card', 'bool'], ['has_papers', 'papers', 'bool'],
    ['has_pouch', 'pouch', 'bool'], ['has_lanyard', 'lanyard', 'bool'], ['has_spare_hardware', 'spare hardware', 'bool'],
    ['sec', 'story (public)'],
    ['notes_public', 'story', 'long'],
    ['sec', 'private'],
    ['price_paid', 'paid $', 'num'], ['acquired_from', 'from', 'text'], ['acquired_date', 'acquired', 'date'],
    ['location', 'location', 'text'], ['condition_note', 'condition note', 'text'], ['notes_private', 'private notes', 'long']
  ];
  var PRIVATE = { price_paid: 'paid', acquired_from: 'from', acquired_date: 'acquired', location: 'location', condition_note: 'condition', notes_private: 'notes' };

  function get(k, key) { return key.indexOf('ext.') === 0 ? (k.ext || {})[key.slice(4)] : k[key]; }
  function isEmpty(v) { return v === null || v === undefined || v === ''; }
  function fmtDate(s) { return (s || '').slice(0, 10); }
  function ageLabel(m) { if (m == null) return ''; if (m < 1) return 'this month'; if (m < 24) return m + ' mo'; return Math.floor(m / 12) + ' yr'; }

  function isHeroEligible(k) { return !!(k.is_public && !k.hidden_at && k.photos.length); }

  function badges(k) {
    var out = [];
    if (k.id === featuredId) {
      if (isHeroEligible(k)) out.push(['★ HERO', 'accent']);
      else out.push(['★ pinned, but not public — fallback hero in use', '']);
    }
    if (k.hidden_at) out.push(['hidden — under review', 'warn']);
    if (k.status === 'draft') out.push(['draft', 'warn']);
    if (!k.is_public) out.push(['private', '']);
    if (k.sale_status && k.sale_status !== 'keeping') out.push([k.sale_status.replace('_', ' '), k.sale_status === 'sold' ? '' : 'accent']);
    if (!k.born_on) out.push(['undated', 'warn']); else if (k.age_months != null) out.push([ageLabel(k.age_months), k.age_months > 12 ? '' : 'ok']);
    return out;
  }
  function title(k) {
    var e = k.ext || {};
    return [e.size, k.model, e.generation, k.blade_shape ? '· ' + k.blade_shape : '', k.blade_steel ? '· ' + k.blade_steel : ''].filter(Boolean).join(' ') || 'untitled';
  }

  function renderRows(tbody, k) {
    clear(tbody);
    var conf = k.confidence || {};
    var pendingSec = null;
    FIELDS.forEach(function (f) {
      if (f[0] === 'sec') { pendingSec = f[1]; return; }
      if (f[1] === 'story' || PRIVATE[f[0]]) return;               // story + private strip render elsewhere
      var v = get(k, f[0]);
      if (f[2] === 'bool') { if (!v) return; v = 'yes'; }
      if (isEmpty(v)) return;
      if (pendingSec) { var tr0 = el('tr', 'sec'); var td0 = el('td', null, pendingSec); td0.colSpan = 2; tr0.appendChild(td0); tbody.appendChild(tr0); pendingSec = null; }
      var field = f[0].replace('ext.', '');
      var tr = el('tr'); tr.appendChild(el('td', 'k', f[1]));
      var td = el('td', 'v');
      if (conf[field]) { var dot = el('span', 'dot ' + conf[field]); dot.title = conf[field]; td.appendChild(dot); }
      td.appendChild(document.createTextNode(String(v)));
      tr.appendChild(td); tbody.appendChild(tr);
    });
    if (k.notes_public) { var tr2 = el('tr'); tr2.appendChild(el('td', 'k', 'story')); tr2.appendChild(el('td', 'v', k.notes_public)); tbody.appendChild(tr2); }
  }

  function renderPhotos(box, k) {
    clear(box);
    if (!k.photos.length) { box.appendChild(el('div', 'empty', 'no photos')); return; }
    var heroSeq = k.hero_photo || k.photos[0].seq;
    var ordered = k.photos.slice().sort(function (a, b) { return (a.seq === heroSeq ? -1 : 0) - (b.seq === heroSeq ? -1 : 0) || a.seq - b.seq; });
    ordered.forEach(function (p, i) {
      var img = el('img', i === 0 ? 'hero' : ''); img.alt = k.tag + ' photo ' + p.seq;
      var v = '?v=' + (p.sha256 || '').slice(0, 8);
      img.src = API + '/knives/' + k.id + '/photos/' + p.seq + (p.has_thumb ? '/thumb' : '/original') + v;
      img.addEventListener('click', function () { window.open(API + '/knives/' + k.id + '/photos/' + p.seq + '/original' + v, '_blank'); });
      box.appendChild(img);
    });
  }

  function renderPrivate(art, k) {
    var dl = art.querySelector('.priv'); clear(dl);
    Object.keys(PRIVATE).forEach(function (key) {
      var v = k[key]; if (isEmpty(v)) return;
      dl.appendChild(el('dt', null, PRIVATE[key])); dl.appendChild(el('dd', null, key === 'price_paid' ? '$' + v : String(v)));
    });
    var ul = art.querySelector('.events'); clear(ul);
    (k.events || []).forEach(function (e) {
      var li = el('li'); li.appendChild(el('b', null, fmtDate(e.date) + ' ' + e.type.replace('_', ' ')));
      var extra = [e.detail, e.amount != null ? '$' + e.amount : '', e.counterparty].filter(Boolean).join(' · ');
      if (extra) li.appendChild(document.createTextNode(' — ' + extra));
      ul.appendChild(li);
    });
  }

  function renderSale(art, k) {
    art.querySelector('.sstatus').value = k.sale_status || 'keeping';
    art.querySelector('.asking').value = k.asking_price != null ? k.asking_price : '';
    art.querySelector('.snote').value = k.seller_note || '';
    syncSale(art);
    art.querySelector('.pub').checked = !!k.is_public;
    art.querySelector('.sale').classList.toggle('hidden', k.status !== 'live');
  }
  function syncSale(art) {
    var s = art.querySelector('.sstatus').value;
    art.querySelector('.amount').classList.toggle('hidden', s !== 'sold');
    art.querySelector('.counterparty').classList.toggle('hidden', s !== 'sold');
    art.querySelector('.asking').classList.toggle('hidden', s === 'sold' || s === 'keeping');
  }
  function clearIrrelevant(art) {
    var s = art.querySelector('.sstatus').value;
    if (s === 'keeping' || s === 'sold') art.querySelector('.asking').value = '';
    if (s !== 'sold') { art.querySelector('.amount').value = ''; art.querySelector('.counterparty').value = ''; }
  }

  function buildForm(form, k) {
    clear(form);
    FIELDS.forEach(function (f) {
      if (f[0] === 'sec') { form.appendChild(el('label', 'sec', f[1])); return; }
      var v = get(k, f[0]);
      var lab = el('label', f[2] === 'bool' ? 'chk' : ''); var input;
      if (f[2] === 'select') {
        input = el('select'); f[3].forEach(function (o) { var op = el('option', null, o === '' ? '—' : o); op.value = o; input.appendChild(op); });
        input.value = isEmpty(v) ? '' : String(v);
      } else if (f[2] === 'bool') {
        input = el('input'); input.type = 'checkbox'; input.checked = !!v;
      } else if (f[2] === 'long') {
        input = el('textarea'); input.value = v || '';
      } else {
        input = el('input'); input.type = f[2] === 'num' ? 'number' : f[2] === 'date' ? 'date' : 'text';
        if (f[2] === 'num') input.step = 'any';
        if (f[2] === 'born') input.placeholder = 'YYYY-MM-DD, YYYY-MM or YYYY';
        input.value = isEmpty(v) ? '' : String(v);
      }
      input.name = f[0];
      if (f[2] === 'bool') { lab.appendChild(input); lab.appendChild(document.createTextNode(f[1])); }
      else { lab.appendChild(document.createTextNode(f[1])); lab.appendChild(input); }
      form.appendChild(lab);
    });
    if (k.photos.length > 1) {
      var lab = el('label', null, 'hero photo'); var sel = el('select'); sel.name = 'hero_photo';
      k.photos.forEach(function (p) { var op = el('option', null, 'photo ' + p.seq); op.value = String(p.seq); sel.appendChild(op); });
      sel.value = String(k.hero_photo || k.photos[0].seq); lab.appendChild(sel); form.appendChild(lab);
    }
    var acts = el('div', 'actions');
    var save = el('button', 'btn', 'SAVE'); save.type = 'submit';
    var cancel = el('button', 'btn alt', 'cancel'); cancel.type = 'button';
    cancel.addEventListener('click', function () { form.classList.add('hidden'); });
    acts.appendChild(save); acts.appendChild(cancel); form.appendChild(acts);
    var danger = el('div', 'danger'); var del = el('button', 'btn link', 'delete this knife'); del.type = 'button';
    del.addEventListener('click', function () { removeKnife(k); });
    danger.appendChild(del); form.appendChild(danger);
  }

  function formDiff(form, k) {
    var body = {}, ext = {};
    FIELDS.forEach(function (f) {
      if (f[0] === 'sec') return;
      var input = form.elements[f[0]]; if (!input) return;
      var v = f[2] === 'bool' ? input.checked : input.value;
      var old = get(k, f[0]);
      if (f[2] === 'bool') { if (!!old !== v) body[f[0]] = v; return; }
      if (f[2] === 'num') { v = v === '' ? null : Number(v); if ((old == null ? null : Number(old)) !== v) body[f[0]] = v; return; }
      if (f[2] === 'select' && f[0] === 'condition') { v = v === '' ? null : Number(v); if ((old == null ? null : old) !== v) body[f[0]] = v; return; }
      if ((old == null ? '' : String(old)) !== v) { if (f[0].indexOf('ext.') === 0) ext[f[0].slice(4)] = v; else body[f[0]] = v; }
    });
    if (Object.keys(ext).length) body.ext = ext;
    var hero = form.elements['hero_photo'];
    if (hero && Number(hero.value) !== (k.hero_photo || k.photos[0].seq)) body.hero_photo = Number(hero.value);
    return body;
  }

  function removeKnife(k) {
    var typed = prompt('Delete ' + k.tag + ' and its photos for good? Type ' + k.tag + ' to confirm.');
    if (typed !== k.tag) return;
    api('/knives/' + k.id, { method: 'DELETE' }).then(function (res) {
      if (!res.ok) throw new Error(res.j.error || 'delete failed');
      knives = knives.filter(function (x) { return x.id !== k.id; }); say(k.tag + ' deleted'); render();
    }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); });
  }

  function renderOne(k) {
    var art = $('tpl').content.firstElementChild.cloneNode(true);
    art.id = k.tag;
    art.querySelector('.tag').textContent = k.tag;
    art.querySelector('.title').textContent = title(k);
    var bs = art.querySelector('.badges');
    badges(k).forEach(function (b) { bs.appendChild(el('span', 'badge ' + b[1], b[0])); bs.appendChild(document.createTextNode(' ')); });
    var sel = art.querySelector('.sel'); sel.checked = !!selected[k.id];
    sel.addEventListener('change', function () { if (sel.checked) selected[k.id] = true; else delete selected[k.id]; syncBulk(); });
    renderPhotos(art.querySelector('.photos'), k);
    renderRows(art.querySelector('.rows'), k);
    var fl = art.querySelector('.flags'); (k.flags || []).forEach(function (f) { fl.appendChild(el('div', null, f)); });
    renderPrivate(art, k);
    renderSale(art, k);
    var more = art.querySelector('details.more');
    if (location.hash.slice(1) === k.tag && !didScroll) openMap[k.id] = true;  // deep link lands expanded
    more.open = !!openMap[k.id];
    more.addEventListener('toggle', function () { openMap[k.id] = more.open; });
    art.querySelector('.sstatus').addEventListener('change', function () { clearIrrelevant(art); syncSale(art); });
    art.querySelector('.apply').addEventListener('click', function () {
      var s = art.querySelector('.sstatus').value;
      var body = { sale_status: s, seller_note: art.querySelector('.snote').value };
      var asking = art.querySelector('.asking').value, amount = art.querySelector('.amount').value, cp = art.querySelector('.counterparty').value;
      if ((s === 'for_sale' || s === 'for_trade' || s === 'consigned') && asking !== '') body.asking_price = Number(asking);
      if (s === 'sold') { if (amount !== '') body.amount = Number(amount); if (cp) body.counterparty = cp; }
      json('POST', '/knives/' + k.id + '/sale', body).then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'could not update');
        say(k.tag + ' → ' + res.j.sale_status.replace('_', ' ')); return reload();
      }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); });
    });
    art.querySelector('.pub').addEventListener('change', function (ev) {
      json('POST', '/knives/' + k.id + '/public', { is_public: ev.target.checked }).then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'could not update');
        k.is_public = res.j.is_public; render();
      }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); });
    });
    var heroBtn = art.querySelector('.hero');
    var pinned = k.id === featuredId;
    if (pinned || isHeroEligible(k)) {
      heroBtn.hidden = false;
      heroBtn.textContent = pinned ? 'unpin' : '★ register hero';
      heroBtn.addEventListener('click', function () {
        json('PATCH', '/settings', { featured_knife_id: pinned ? null : k.id }).then(function (res) {
          if (!res.ok) { say('✗ ' + (res.j.error || 'could not update'), true); return; }
          featuredId = res.j.featured_knife_id;
          say(pinned ? k.tag + ' unpinned' : '★ ' + k.tag + ' is now your register hero');
          render();
        }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); });
      });
    }
    var form = art.querySelector('.form');
    art.querySelector('.edit').addEventListener('click', function () {
      if (form.classList.contains('hidden')) { buildForm(form, k); form.classList.remove('hidden'); form.scrollIntoView({ block: 'nearest' }); }
      else form.classList.add('hidden');
    });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var body = formDiff(form, k);
      if (!Object.keys(body).length) { form.classList.add('hidden'); return; }
      json('PATCH', '/knives/' + k.id, body).then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'save failed');
        say(k.tag + ' saved' + (res.j.flags.length ? ' — ' + res.j.flags.length + ' flag(s)' : ''));
        return reload();
      }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); });
    });
    art.querySelector('.redecode').addEventListener('click', function () {
      if (!k.photos.length) { say('add a photo first', true); return; }
      if (!confirm('Re-read the card for ' + k.tag + '? The card fields will be replaced by what the model reads (your notes and private strip stay).')) return;
      say('⚡ reading the card… (10–30 s)');
      json('POST', '/knives/' + k.id + '/decode', {}).then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'decode failed');
        say('✓ ' + k.tag + ' re-read' + (res.j.decoded.flags.length ? ' — ' + res.j.decoded.flags.length + ' flag(s)' : '')); return reload();
      }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); });
    });
    return art;
  }

  function matches(k, q) { return !q || JSON.stringify(k).toLowerCase().indexOf(q) !== -1; }

  function render() {
    var y = window.scrollY;  // rebuilding #cards collapses the page for a tick; put the reader back
    var q = $('q').value.trim().toLowerCase();
    var live = knives.filter(function (k) { return k.status === 'live'; });
    var drafts = knives.filter(function (k) { return k.status === 'draft'; });
    $('count').textContent = live.length + ' knife' + (live.length === 1 ? '' : 's') + (drafts.length ? ' · ' + drafts.length + ' draft' + (drafts.length === 1 ? '' : 's') : '');
    var d = $('drafts'); clear(d);
    drafts.forEach(function (k) {
      var a = el('a'); a.href = '/blade-book/me/add/';
      a.appendChild(el('b', null, k.tag)); a.appendChild(document.createTextNode(' · draft · ' + k.photos.length + '/3 photos — finish in add →'));
      d.appendChild(a);
    });
    var c = $('cards'); clear(c);
    var shown = live.filter(function (k) { return matches(k, q); });
    if (!live.length) { var e = el('div', 'empty', 'Your register is empty.'); var a2 = el('a', 'btn accent', '📷 add the first knife'); a2.href = '/blade-book/me/add/'; e.appendChild(a2); c.appendChild(e); }
    else if (!shown.length) c.appendChild(el('div', 'empty', 'nothing matches “' + q + '”'));
    shown.forEach(function (k) { c.appendChild(renderOne(k)); });
    syncBulk();
    window.scrollTo(0, y);
  }

  function syncBulk() {
    var ids = Object.keys(selected);
    $('bulkbar').classList.toggle('hidden', ids.length === 0);
    $('bulkn').textContent = ids.length + ' selected';
  }
  function bulk(isPublic) {
    var ids = Object.keys(selected).map(Number);
    json('POST', '/knives/bulk', { ids: ids, is_public: isPublic }).then(function (res) {
      if (!res.ok) throw new Error(res.j.error || 'bulk failed');
      say(res.j.changed + ' knife' + (res.j.changed === 1 ? '' : 's') + ' made ' + (isPublic ? 'public' : 'private'));
      selected = {}; return reload();
    }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); });
  }
  $('bulkpub').addEventListener('click', function () { bulk(true); });
  $('bulkpriv').addEventListener('click', function () { bulk(false); });
  $('bulkclear').addEventListener('click', function () { selected = {}; render(); });
  $('q').addEventListener('input', render);
  $('signout').addEventListener('click', function () {
    api('/auth/signout', { method: 'POST' }).then(function () { location.href = '/blade-book/'; });
  });

  function reload() {
    return api('/knives/full').then(function (res) {
      if (!res.ok) throw new Error(res.j.error || 'could not load your register');
      knives = res.j.knives || []; render();
      if (!didScroll && location.hash && document.getElementById(location.hash.slice(1))) {
        document.getElementById(location.hash.slice(1)).scrollIntoView(); didScroll = true;
      }
    });
  }

  function loadSettings() {
    return api('/settings').then(function (res) {
      if (!res.ok) { say('✗ could not load settings', true); return; }
      var s = res.j;
      featuredId = s.featured_knife_id || null;
      $('publink').href = s.public_url;
      $('publink').textContent = s.public_url;
      $('hideday').checked = !!s.hide_born_day;
      $('privprof').checked = !!s.profile_private;
      $('clearkey').hidden = !s.has_key;
      if (s.has_key) $('pagekey').placeholder = 'a key is set — enter a new one to change it';
      else $('pagekey').placeholder = 'no key — page is open';
    }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); });
  }

  $('hideday').addEventListener('change', function (ev) {
    json('PATCH', '/settings', { hide_born_day: ev.target.checked }).then(function (res) {
      if (!res.ok) { say('✗ ' + (res.j.error || 'could not update'), true); return loadSettings(); }
      loadSettings();
    }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); loadSettings(); });
  });

  $('privprof').addEventListener('change', function (ev) {
    json('PATCH', '/settings', { profile_private: ev.target.checked }).then(function (res) {
      if (!res.ok) { say('✗ ' + (res.j.error || 'could not update'), true); return loadSettings(); }
      loadSettings();
    }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); loadSettings(); });
  });

  $('savekey').addEventListener('click', function () {
    var key = $('pagekey').value.trim();
    if (!key) return;
    json('PATCH', '/settings', { public_key: key }).then(function (res) {
      if (!res.ok) { say('✗ ' + (res.j.error || 'could not update'), true); return loadSettings(); }
      $('pagekey').value = '';
      loadSettings();
    }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); loadSettings(); });
  });

  $('clearkey').addEventListener('click', function () {
    json('PATCH', '/settings', { public_key: '' }).then(function (res) {
      if (!res.ok) { say('✗ ' + (res.j.error || 'could not update'), true); return loadSettings(); }
      loadSettings();
    }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); loadSettings(); });
  });

  // /auth/me and /settings are independent — fetch in parallel, but wait for
  // BOTH (loadSettings swallows its own error) before the first render, so
  // featuredId is already known and no card briefly claims a false hero state.
  Promise.all([
    api('/auth/me').then(function (res) { $('handle').textContent = '@' + (res.j.handle || ''); }),
    loadSettings()
  ]).then(function () {
    return reload();
  }).catch(function (e) { if (e.message !== 'sign in') say('✗ ' + e.message, true); });
})();
</script>
